  <!-- Gövde: karın + baş -->
  <ellipse cx="31.2" cy="33.5" rx="4.4" ry="3.4" transform="rotate(132.2 31.2 33.5)" fill="#E0F2FE" stroke="#0B1426" stroke-width="1.4"/>
  <circle cx="35.4" cy="28.8" r="2.4" fill="#E0F2FE" stroke="#0B1426" stroke-width="1.4"/>
