      <stop offset="0" stop-color="#0F1C38"/>
      <stop offset="1" stop-color="#060B17"/>
    </linearGradient>
    <linearGradient id="zq-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
