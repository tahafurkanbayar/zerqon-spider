  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#zq-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#1E3A6B" stroke-width="1"/>
