# Windows masaüstü paketi: her yayımlanan GitHub Release için .exe derlenir, doğrulanır ve yayına eklenir.
# Elle çalıştırıldığında (workflow_dispatch) paket yalnızca iş akışı çıktısı (artifact) olarak saklanır.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt

      - name: Bağımlılıklar
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-desktop.txt

      - name: Testler
        run: python -m pytest -q

      - name: Paketle ve doğrula (smoke test)
        run: python packaging/windows/build.py

      - uses: actions/upload-artifact@v5
        with:
          name: ZerqonSpider-windows-x64
          path: |
            dist/ZerqonSpider-*-windows-x64.exe
            dist/ZerqonSpider-*-windows-x64.exe.sha256

      - name: Yayına ekle
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ZerqonSpider-*-windows-x64.exe dist/ZerqonSpider-*-windows-x64.exe.sha256 --clobber
